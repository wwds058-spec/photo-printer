name: Android build

on:
  push:
    branches: ["claude/**", main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; just accept licences and make sure the pieces we target exist.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (domain + presentation)
        run: ./gradlew test --stacktrace

      - name: Type-check the Compose UI
        run: ./gradlew :ui:compileKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTOPrintPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
