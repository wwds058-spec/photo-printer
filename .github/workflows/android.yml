name: Android build

on:
  push:
    branches: ["claude/**", main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; just accept licences and make sure the pieces we target exist.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (domain + presentation)
        run: ./gradlew test --stacktrace

      - name: Type-check the Compose UI
        run: ./gradlew :ui:compileKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PHOTOPrintPro-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTOPrintPro-debug-apk
          path: PHOTOPrintPro-debug.apk
          if-no-files-found: error

      # A plain .apk download (no zip), easy to open from a phone. One pre-release per build; debug-signed, for testing.
      - name: Publish APK as a GitHub pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Debug-signed test build of PHOTOPrint Pro (commit ${{ github.sha }}).
            Download `PHOTOPrintPro-debug.apk`, open it on your Android phone and allow installing from this source.
          files: PHOTOPrintPro-debug.apk
